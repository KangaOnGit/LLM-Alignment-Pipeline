default:
  model: "meta-llama/Llama-3.2-3B-Instruct"
  seed: 42

cache:
  path: "./cache"

format:
  reasoning_start: "<thinking>"
  reasoning_end: "</thinking>"
  solution_start: "<answer>"
  solution_end: "</answer>"

train:
  lr: 5.e-6
  weight_decay: 5.e-4
  warmup_ratio: 0.1
  lr_scheduler: "cosine"
  optim: "adamw_torch_fused"

  batch_size: 8
  gradient_steps: 64

  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 1536

  epochs: 1
  max_steps: -1

  logging_steps: 1
  save_steps: 20
  save_strategy: "steps"

  max_grad_norm: 0.1
  report_to: "wandb"

generation:
  temperature: 1.0
  top_p: 1.0

wandb:
  project: "grpo"

output:
  dir: "outputs/grpo"
  hub_name: "Llama-3.2-3B-GRPO"

data:
  path: "5CD-AI/Vietnamese-meta-math-MetaMathQA-40K-gg-translated"