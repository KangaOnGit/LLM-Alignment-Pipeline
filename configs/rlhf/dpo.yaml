default:
  model: "thainq107/Llama-3.2-1B-Instruct-sft"
  seed: 42

cache:
  path: "./cache"

train:
  batch_size: 16
  gradient_steps: 8

  gradient_checkpointing: true

  lr: 3e-5
  epochs: 2

  logging_steps: 200
  save_strategy: "no"

  overwrite_output_dir: true

  optim: "paged_adamw_8bit"

  warmup_steps: 200

  bf16: true

  max_length: 512

dpo:
  beta: 0.1

output:
  hub_name: "Llama-3.2-1B-Instruct-dpo"
  dir: "outputs/dpo"

data:
  path: "thainq107/Vi-Alpaca-Preference"